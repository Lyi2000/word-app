<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="背单词">
<meta name="theme-color" content="#4a7dff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.png">
<link rel="stylesheet" href="css/style.css">
<title>背单词</title>
</head>
<body>

<header id="topbar"><h1 id="pageTitle">录入</h1></header>

<main id="main">

  <!-- ============ 录入 ============ -->
  <section class="page" id="page-entry">
    <div class="card">
      <h2>目录管理</h2>
      <div id="dirTreeEntry" class="tree"></div>
      <div class="row">
        <input id="newRootDirName" type="text" placeholder="目录名称，如：四级词汇 / Unit 1">
        <button class="btn primary" id="addRootDirBtn">添加根目录</button>
      </div>
      <p class="hint">目录支持无限层级（单词书 → Unit → Lesson）。删除目录不会删除单词，只是解除归属。</p>
    </div>

    <div class="card">
      <h2 id="wordFormTitle">录入单词</h2>
      <form id="wordForm">
        <input type="text" id="wText" placeholder="单词 *" autocomplete="off" autocapitalize="off">

        <label class="check"><input type="checkbox" id="wIsDerived"> 是派生词</label>
        <select id="wParent" hidden>
          <option value="">选择所属单词（派生词必选）</option>
        </select>

        <div class="field-label">所属目录 *（可多选，一个单词可属于多个目录）</div>
        <div id="wDirs" class="dir-checks"></div>

        <div class="field-label">词性与意思 *（至少一条）</div>
        <div id="senseRows"></div>
        <button type="button" class="btn ghost small" id="addSenseBtn">添加词性 / 意思</button>

        <textarea id="wTip" rows="2" placeholder="提示（选填），如：词根 spect 表示「看」"></textarea>

        <div class="row">
          <button type="submit" class="btn primary grow" id="saveWordBtn">保存</button>
          <button type="button" class="btn ghost" id="cancelEditBtn" hidden>取消编辑</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>单词列表</h2>
      <input type="search" id="wordSearch" placeholder="搜索单词">
      <div id="wordList"></div>
    </div>
  </section>

  <!-- ============ 词库 ============ -->
  <section class="page" id="page-library" hidden>
    <div class="toolbar">
      <button class="btn" id="toggleAllBtn">显示全部释义</button>
      <button class="btn" id="toggleSelBtn">显示/隐藏所选目录释义</button>
    </div>
    <p class="hint">勾选目录后点上方按钮，可整体显示/隐藏该目录下所有单词及派生词的释义；每个目录都有「随机背」按钮。</p>
    <div id="dirTreeLib" class="tree"></div>
    <div id="libEmpty" class="empty" hidden>还没有目录或单词，先去「录入」添加吧。</div>
  </section>

  <!-- ============ 背单词 ============ -->
  <section class="page" id="page-study" hidden>
    <div id="studyHome">
      <div class="card">
        <label class="check"><input type="checkbox" id="includeDerivedChk"> 背单词时包含派生词</label>
      </div>
      <div class="card mode-card">
        <button class="mode-btn learn" data-mode="learn"><b>背单词</b><span id="learnCount"></span></button>
        <button class="mode-btn review" data-mode="review"><b>复习单词</b><span id="reviewCount"></span></button>
        <button class="mode-btn rand" data-mode="random"><b>随机背</b><span id="randomCount"></span></button>
      </div>
      <p class="hint">复习按艾宾浩斯遗忘曲线安排：<br>认识 → 间隔变长（1/2/4/7/15/30/60 天）<br>模糊 → 间隔缩短，尽快重现<br>不认识 → 明天继续出现，直到记住<br>当天漏背的单词会顺延出现，不会丢。</p>
    </div>

    <div id="studyCard" hidden>
      <div class="progress" id="studyProgress"></div>
      <div class="card word-card">
        <div class="word-line">
          <span id="cardTag" class="tag" hidden></span>
          <span id="cardWord" class="big-word"></span>
          <button class="icon-btn" id="speakBtn" aria-label="朗读">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 8.5c1.6 1.4 1.6 5.6 0 7" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6c2.8 2.6 2.8 9.4 0 12" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <button class="btn ghost" id="tipBtn">提示</button>
        <div id="tipBox" class="tip-box" hidden></div>
        <div id="answerBox" class="answer" hidden></div>
        <div class="grade-row" id="gradeRow">
          <button class="grade bad" data-r="0">不认识</button>
          <button class="grade mid" data-r="1">模糊</button>
          <button class="grade good" data-r="2">认识</button>
        </div>
        <button class="btn primary" id="nextBtn" hidden>下一个</button>
        <button class="btn ghost" id="quitBtn">结束本次学习</button>
      </div>
    </div>

    <div id="studyDone" hidden>
      <div class="card done-card">
        <h2>本轮完成</h2>
        <div id="doneStats"></div>
        <button class="btn primary" id="backHomeBtn">返回</button>
      </div>
    </div>
  </section>

</main>

<nav id="tabbar">
  <button class="tab active" data-page="page-entry" data-title="录入">录入</button>
  <button class="tab" data-page="page-library" data-title="词库">词库</button>
  <button class="tab" data-page="page-study" data-title="背单词">背单词</button>
</nav>

<script src="js/model.js"></script>
<script src="js/entry.js"></script>
<script src="js/library.js"></script>
<script src="js/study.js"></script>
<script src="js/app.js"></script>
</body>
</html>
